plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.interviewcodi'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'load', 'eval', 'stt-eval'
	}
}

// 부하 측정. 일반 테스트에서 빼고 따로 실행한다: ./gradlew loadTest [-Dload.workerConcurrency=4 ...]
tasks.register('loadTest', Test) {
	description = 'Runs load measurements tagged with "load".'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'load'
	}
	systemProperties System.properties.findAll { it.key.toString().startsWith('load.') }
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
	}
}

// AI 생성 품질·지연·토큰 평가. 실제 API를 호출하므로 따로 실행한다.
// ./gradlew aiEval -Deval.models=gemini-3.8-flash,gemini-3.1-flash-lite            (계획만 출력)
// ./gradlew aiEval -Deval.models=... -Deval.execute=true                           (실제 호출)
tasks.register('aiEval', Test) {
	description = 'Runs AI generation evaluations tagged with "eval".'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'eval'
	}
	systemProperties System.properties.findAll { it.key.toString().startsWith('eval.') }
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
	}
}

// 음성인식 제공자 평가. 녹음은 저장소 루트 eval-audio/(Git 제외). aiEval과 태그를 나눠 한쪽 실행이 다른 쪽 요금을 쓰지 않게 한다.
// ./gradlew sttEval -Deval.stt=openai,rtzr,clova                    (계획만 출력)
// ./gradlew sttEval -Deval.stt=openai -Deval.limit=1 -Deval.execute=true   (실제 호출)
tasks.register('sttEval', Test) {
	description = 'Runs speech-to-text provider evaluations tagged with "stt-eval".'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'stt-eval'
	}
	systemProperties System.properties.findAll { it.key.toString().startsWith('eval.') }
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
	}
}
