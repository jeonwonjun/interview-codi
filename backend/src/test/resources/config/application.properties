# 테스트에서만 덮어쓰는 설정. classpath:/config/application.properties는 기본 application.properties보다 우선한다.
# AI 워커를 끈다. 테스트는 AiRequestProcessingService를 직접 불러 처리 순서를 제어한다.
practice.ai.worker.enabled=false

# 테스트는 실제 LLM을 호출하지 않는다. .env의 AI_PROVIDER와 상관없이 가짜 생성기를 쓴다.
# 실제 호출은 ./gradlew aiEval(평가 실행기, -Deval.execute=true 필요)만 한다.
practice.ai.provider=fake

# 녹음은 빌드 폴더 아래에 쓴다. 테스트가 끝나도 남지만 ./gradlew clean으로 지워진다.
practice.recording.local-dir=build/test-recordings
# 음성인식도 .env의 STT_PROVIDER와 상관없이 가짜 인식기를 쓴다.
practice.stt.provider=fake
