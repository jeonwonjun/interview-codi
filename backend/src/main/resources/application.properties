spring.application.name=backend

# 저장소 루트 또는 backend 폴더의 .env를 읽는다(.env는 Git에서 제외). 키 목록은 루트 .env.example 참고.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# 로컬 개발 DB(저장소 루트 compose.yaml)의 기본값. 다른 환경은 환경 변수로 덮어쓴다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/interview_codi}
spring.datasource.username=${DB_USERNAME:interview_codi}
spring.datasource.password=${DB_PASSWORD:interview_codi}

# 스키마 변경은 src/main/resources/db/migration의 SQL 파일로만 적용한다.
spring.flyway.locations=classpath:db/migration

# 로그인 세션은 PostgreSQL에 저장한다. 테이블은 Flyway(V2)가 만든다.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# 카카오 로그인. OIDC는 사용하지 않고 사용자 정보 API의 회원번호(id)만 사용한다.
# 키가 없으면 서버는 뜨지만 카카오 로그인은 실패한다.
kakao.client-id=${KAKAO_CLIENT_ID:not-configured}
kakao.client-secret=${KAKAO_CLIENT_SECRET:not-configured}
kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
kakao.token-uri=https://kauth.kakao.com/oauth/token
kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# 오류 응답은 ProblemDetail(RFC 9457) 형식으로 통일한다. 업무 오류 코드는 GlobalExceptionHandler가 더한다.
spring.mvc.problemdetails.enabled=true

# AI 요청 워커. 동시 처리 수만큼 슬롯이 돌며, 큐가 비면 poll-interval만큼 쉰다.
# 동시 처리 4: 피크 30명(도착 0.5건/초)·AI 3~8초 가정에서 측정해 정한 값(설계 문서 5-1, 2026-11-19).
# 실제 AI 제공자를 연결하면 응답 시간과 호출 한도로 다시 정한다.
practice.ai.worker.enabled=true
practice.ai.worker.concurrency=4
practice.ai.worker.poll-interval=1s
