spring.application.name=backend

# 저장소 루트 또는 backend 폴더의 .env를 읽는다(.env는 Git에서 제외). 키 목록은 루트 .env.example 참고.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# 로컬 개발 DB(저장소 루트 compose.yaml)의 기본값. 다른 환경은 환경 변수로 덮어쓴다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/interview_codi}
spring.datasource.username=${DB_USERNAME:interview_codi}
spring.datasource.password=${DB_PASSWORD:interview_codi}

# 스키마 변경은 src/main/resources/db/migration의 SQL 파일로만 적용한다.
spring.flyway.locations=classpath:db/migration

# 로그인 세션은 PostgreSQL에 저장한다. 테이블은 Flyway(V2)가 만든다.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# 카카오 로그인. OIDC는 사용하지 않고 사용자 정보 API의 회원번호(id)만 사용한다.
# 키가 없으면 서버는 뜨지만 카카오 로그인은 실패한다.
kakao.client-id=${KAKAO_CLIENT_ID:not-configured}
kakao.client-secret=${KAKAO_CLIENT_SECRET:not-configured}
kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
kakao.token-uri=https://kauth.kakao.com/oauth/token
kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# 오류 응답은 ProblemDetail(RFC 9457) 형식으로 통일한다. 업무 오류 코드는 GlobalExceptionHandler가 더한다.
spring.mvc.problemdetails.enabled=true

# AI 요청 워커. 동시 처리 수만큼 슬롯이 돌며, 큐가 비면 poll-interval만큼 쉰다.
# 동시 처리 10: 피크 30명·꼬리질문 30%(AI 요청 약 0.65건/초)에서 gpt-6.1-terra 지연(호출당 p50 9.5초, p95 12초)을
# 7~12초로 흉내 내 측정해 정한 값(설계 문서 5-1, 결정 기록 0008). 6이면 큐가 쌓여 전체 p95가 18초였다.
practice.ai.worker.enabled=true
practice.ai.worker.concurrency=10
practice.ai.worker.poll-interval=1s

# AI 생성기. fake(기본, 정해진 문구), openai, gemini.
# 실제 사용자 답변을 받는 환경에서는 결제를 연결한 유료 등급 키만 쓴다(무료 등급 입력은 Google 제품 개선에 쓰인다).
practice.ai.provider=${AI_PROVIDER:fake}
practice.ai.gemini.api-key=${GEMINI_API_KEY:}
practice.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
practice.ai.gemini.thinking-level=${GEMINI_THINKING_LEVEL:low}
practice.ai.gemini.base-uri=https://generativelanguage.googleapis.com
practice.ai.gemini.timeout=30s
practice.ai.openai.api-key=${OPENAI_API_KEY:}
practice.ai.openai.model=${OPENAI_MODEL:gpt-6.1-terra}
practice.ai.openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
practice.ai.openai.base-uri=https://api.openai.com
practice.ai.openai.timeout=30s
